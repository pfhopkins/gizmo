# CI cannot RUN this suite: every test builds GIZMO with MPI and then integrates a simulation
# for minutes to hours on many cores -- the real runs happen on the Flatiron clusters. What a
# runner CAN do is prove the suite is intact: every test module imports (wiring to gizmo.*,
# stray syntax), every Python file in the tree compiles, and pytest can enumerate the tests.
# That is what caught nothing when this workflow tried `pytest` bare -- it just died slowly.

name: pytest

on:
  pull_request:
    branches: ["starforge_dev"]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
    - name: Compile all Python sources
      run: python -m compileall -q python_src test
    - name: Collect the test suite
      run: pytest --collect-only -q test/
