[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gizmo"
version = "0.1"
description = "Tests and helper scripts for the gizmo mesh-free multi-physics code"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["pytest","pytest-timeout","h5py","matplotlib","astropy","numpy", "scipy", "meshoid"]
license = "MIT"

[project.urls]
Homepage = "https://github.com/phopkins/gizmo"
Issues = "https://github.com/phopkins/gizmo/issues"

[tool.setuptools.packages.find]
where = ["python_src"]

[tool.pytest.ini_options]
timeout = 0  # opt-in: no global timeout. Use @pytest.mark.timeout(seconds) per test, or GIZMO_TEST_TIMEOUT=N for the subprocess timeout.
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
# ruff also honours .gitignore, so test outputs and build products are skipped
extend-exclude = ["python_src/gizmo.egg-info", "build"]

[tool.ruff.lint]
# error-class only: syntax errors (E9) and pyflakes (F: undefined names, unused imports/variables,
# redefinitions); no style rules
select = ["E9", "F"]
